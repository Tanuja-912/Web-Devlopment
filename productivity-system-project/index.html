<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🔥 Productivity System</title>

<style>

/* =========================
   BASE (DESKTOP FIRST)
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(#021027,#000);
  color:white;
  padding:40px;
  overflow-x:hidden;
}

/* PARTICLES */
.circle-container{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:0;
}

.circle{
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  opacity:0.5;
  animation: floatUp linear infinite;
}

@keyframes floatUp{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-60px); }
  100%{ transform:translateY(0); }
}

/* MAIN CONTAINER */
.container{
  max-width:1500px;
  margin:auto;
  background:rgba(255,255,255,0.06);
  padding:40px;
  border-radius:25px;
  position:relative;
  z-index:2;
  backdrop-filter: blur(6px);
}

h1{
  text-align:center;
  color:#00ffff;
  margin-bottom:30px;
  font-size:38px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
  gap:25px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.08);
  padding:25px;
  border-radius:18px;
}

/* TASK LIST */
#taskList{
  margin-top:10px;
  max-height:180px;
  overflow-y:auto;
}

.task{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  margin-top:8px;
  background:rgba(0,0,0,0.3);
  border-radius:8px;
}

/* INPUTS */
input,select,button{
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  font-size:16px;
}

button{
  background:#00bfff;
  color:white;
  cursor:pointer;
}

/* TIMER */
.timer{
  font-size:44px;
  text-align:center;
  margin:20px 0;
}

/* BADGES (FIXED) */
#badges{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.badge{
  padding:10px;
  background:#222;
  border-radius:10px;
  font-size:14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width:600px){

  body{
    padding:12px;
  }

  .container{
    padding:18px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:12px;
  }

  h1{
    font-size:24px;
  }

  input,select,button{
    font-size:14px;
    padding:10px;
  }

  .timer{
    font-size:30px;
  }

  .task{
    font-size:13px;
  }
}

</style>
</head>

<body>

<div class="circle-container" id="circleContainer"></div>

<div class="container">

<h1>🔥 Productivity System</h1>

<div class="grid">

<!-- TASKS -->
<div class="card">
<h2>📌 Daily Focus Board</h2>

<input id="taskInput" placeholder="Add task">
<button onclick="addTask()">Add</button>

<div id="taskList"></div>

<p id="progressText">Progress: 0%</p>
</div>

<!-- TIMER -->
<div class="card">
<h2>⏱️ Timer</h2>

<input type="number" id="minutesInput" placeholder="Minutes">

<div class="timer" id="timer">00:00</div>

<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>

<p>Sessions: <span id="sessions">0</span></p>
</div>

<!-- REVIEW -->
<div class="card">
<h2>🧠 Review</h2>

<textarea id="reviewText"></textarea>

<select id="mood">
<option>😄</option>
<option>😐</option>
<option>😞</option>
</select>

<button onclick="saveReview()">Save</button>

<p id="reviewOutput"></p>
</div>

<!-- STATS + BADGES -->
<div class="card">
<h2>📊 Stats</h2>

<p>Today: <span id="todayScore">0</span></p>
<p>Avg: <span id="weeklyAvg">0</span></p>
<p>Best: <span id="bestDay">0</span></p>

<h3 style="margin-top:15px;">🏆 Badges</h3>
<div id="badges"></div>

</div>

</div>
</div>

<script>

/* PARTICLES */
const circleContainer = document.getElementById("circleContainer");

for(let i=0;i<120;i++){
  const c = document.createElement("div");
  c.className = "circle";

  c.style.left = Math.random()*100 + "vw";
  c.style.top = Math.random()*100 + "vh";
  c.style.animationDuration = (4 + Math.random()*8) + "s";
  c.style.opacity = Math.random();

  circleContainer.appendChild(c);
}

/* STATE */
let tasks = [];
let dailyScores = [];
let sessions = 0;

/* ADD TASK */
function addTask(){
  const input = document.getElementById("taskInput");
  if(!input.value) return;

  tasks.push({ text: input.value, done:false });
  input.value="";

  renderTasks();
  updateProgress();
}

/* RENDER */
function renderTasks(){
  const list=document.getElementById("taskList");
  list.innerHTML="";

  tasks.forEach((t,i)=>{
    const div=document.createElement("div");
    div.className="task";

    div.innerHTML=`
      <span>${t.text}</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${i})">
        <button onclick="deleteTask(${i})" style="background:red;font-size:12px;padding:6px;">🗑️</button>
      </div>
    `;

    list.appendChild(div);
  });
}

/* TOGGLE */
function toggleTask(i){
  tasks[i].done=!tasks[i].done;
  renderTasks();
  updateProgress();
}

/* DELETE */
function deleteTask(i){
  tasks.splice(i,1);
  renderTasks();
  updateProgress();
}

/* PROGRESS */
function updateProgress(){
  const done=tasks.filter(t=>t.done).length;
  const percent=tasks.length?Math.floor(done/tasks.length*100):0;

  document.getElementById("progressText").innerText="Progress: "+percent+"%";
  document.getElementById("todayScore").innerText=percent;

  updateStats(percent);
}

/* STATS */
function updateStats(score){

  if(dailyScores[dailyScores.length-1]!==score){
    dailyScores.push(score);
  }

  let avg=dailyScores.reduce((a,b)=>a+b,0)/dailyScores.length||0;
  let best=Math.max(...dailyScores,0);

  document.getElementById("weeklyAvg").innerText=Math.floor(avg);
  document.getElementById("bestDay").innerText=best;

  updateBadges(score);
}

/* BADGES FIXED */
function updateBadges(score){
  const box=document.getElementById("badges");
  box.innerHTML="";

  if(score>=30) box.innerHTML+=`<div class="badge">🔥 Starter</div>`;
  if(score>=70) box.innerHTML+=`<div class="badge">⚡ Focused</div>`;
  if(score==100) box.innerHTML+=`<div class="badge">💎 Perfect</div>`;
}

/* TIMER */
let time=0, interval, running=false;

function startTimer(){
  if(running) return;

  if(time===0){
    const mins=parseInt(document.getElementById("minutesInput").value);
    if(!mins) return alert("Enter minutes");
    time=mins*60;
  }

  running=true;

  interval=setInterval(()=>{
    time--;

    let m=Math.floor(time/60);
    let s=time%60;

    document.getElementById("timer").innerText=
      `${m}:${s<10?"0":""}${s}`;

    if(time<=0){
      clearInterval(interval);
      running=false;
      sessions++;
      document.getElementById("sessions").innerText=sessions;
      alert("Done!");
    }
  },1000);
}

function pauseTimer(){
  clearInterval(interval);
  running=false;
}

function resetTimer(){
  clearInterval(interval);
  time=0;
  running=false;
  document.getElementById("timer").innerText="00:00";
}

/* REVIEW */
function saveReview(){
  const text=document.getElementById("reviewText").value;
  const mood=document.getElementById("mood").value;
  document.getElementById("reviewOutput").innerText=mood+" "+text;
}

</script>

</body>
</html>
